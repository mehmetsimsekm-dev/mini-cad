<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#172033"><link rel="manifest" href="manifest.webmanifest">
<title>Mini CAD</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#edf1f6}
*{box-sizing:border-box}body{margin:0;overflow:hidden}
header{height:48px;background:#172033;color:white;display:flex;align-items:center;gap:8px;padding:0 10px;font-weight:650}
header small{font-weight:400;opacity:.75}
.toolbar{display:flex;gap:6px;padding:8px;background:#fff;overflow-x:auto;border-bottom:1px solid #ccd3df}
button,.filebtn{border:1px solid #c7cfdb;background:#f7f9fc;border-radius:9px;padding:9px 11px;font-size:14px;white-space:nowrap;color:#172033}
button.active{background:#dceaff;border-color:#4688df;color:#064e9b}
#stage{position:absolute;top:106px;bottom:32px;left:0;right:0;background:#fff;touch-action:none}
canvas{width:100%;height:100%;display:block}
footer{position:absolute;bottom:0;height:32px;background:#172033;color:#fff;left:0;right:0;display:flex;align-items:center;padding:0 10px;font-size:12px;justify-content:space-between}
input[type=file]{display:none}
#notice{position:absolute;left:10px;bottom:42px;background:#172033;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;opacity:.92;pointer-events:none}
#help{position:absolute;right:8px;bottom:42px;background:#f5f7faeF;border:1px solid #d7dce5;border-radius:8px;padding:7px 9px;font-size:11px;max-width:210px}
</style>
</head>
<body>
<header>Mini CAD <small>iPad Edition · DXF ilk prototip</small></header>
<div class="toolbar">
<label class="filebtn" for="file">DXF Aç</label><input id="file" type="file" accept=".dxf">
<button id="save">DXF Kaydet</button><button data-tool="select" class="active">Seç</button><button data-tool="pan">Pan</button><button data-tool="line">Çizgi</button><button id="del">Sil</button><button id="undo">↶ Geri</button><button id="redo">↷ Yinele</button><button id="fit">Sığdır</button><button id="zin">+</button><button id="zout">−</button>
</div>
<div id="stage"><canvas id="c"></canvas></div>
<div id="notice">DXF dosyası açarak başlayın.</div>
<div id="help">Parmak: seç / sürükle · İki parmak: zoom ve pan<br>Apple Pencil: çizim ve seçim</div>
<footer><span id="status">Hazır · Birim: DXF dosyasına bağlı</span><span id="count">0 nesne</span></footer>
<script>
(()=>{
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
let ents=[],undo=[],redo=[],tool='select',view={s:1,x:0,y:0},selected=-1,drag=null,pointers=new Map(),lastPinch=null,lineStart=null,filename='minicad.dxf';
const $=id=>document.getElementById(id),say=t=>$('notice').textContent=t;
function snapshot(){undo.push(JSON.stringify(ents));if(undo.length>100)undo.shift();redo=[]}
function restore(a){ents=JSON.parse(a);selected=-1;draw()}
function resize(){let r=stage.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function bounds(){let pts=[];ents.forEach(e=>{if(e.type==='LINE')pts.push(e.a,e.b);else if(e.type==='CIRCLE')pts.push({x:e.x-e.r,y:e.y-e.r},{x:e.x+e.r,y:e.y+e.r});else if(e.type==='ARC'||e.type==='POLYLINE')e.pts.forEach(p=>pts.push(p));});if(!pts.length)return {minX:-100,minY:-100,maxX:100,maxY:100};return {minX:Math.min(...pts.map(p=>p.x)),minY:Math.min(...pts.map(p=>p.y)),maxX:Math.max(...pts.map(p=>p.x)),maxY:Math.max(...pts.map(p=>p.y))}}
function fit(){let b=bounds(),w=canvas.clientWidth,h=canvas.clientHeight,dx=b.maxX-b.minX||1,dy=b.maxY-b.minY||1;view.s=Math.min(w/dx,h/dy)*.86;view.x=(w-(b.minX+b.maxX)*view.s)/2;view.y=(h+(b.minY+b.maxY)*view.s)/2;draw()}
function world(p){return {x:(p.x-view.x)/view.s,y:(view.y-p.y)/view.s}}
function screen(p){return {x:view.x+p.x*view.s,y:view.y-p.y*view.s}}
function pathPolyline(e){let pts=e.pts;if(!pts.length)return;ctx.beginPath();let a=screen(pts[0]);ctx.moveTo(a.x,a.y);for(let i=1;i<pts.length;i++){let b=screen(pts[i]);ctx.lineTo(b.x,b.y)}if(e.closed)ctx.closePath();ctx.stroke()}
function draw(){let w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.save();ctx.strokeStyle='#e9edf3';ctx.lineWidth=1;let step=50*view.s;if(step>18&&step<160){for(let x=((view.x%step)+step)%step;x<w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=((view.y%step)+step)%step;y<h;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}
ents.forEach((e,i)=>{ctx.strokeStyle=i===selected?'#e23b32':'#172033';ctx.lineWidth=i===selected?2.8:1.35;if(e.type==='LINE'){let a=screen(e.a),b=screen(e.b);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}else if(e.type==='CIRCLE'){let p=screen({x:e.x,y:e.y});ctx.beginPath();ctx.arc(p.x,p.y,e.r*view.s,0,Math.PI*2);ctx.stroke()}else if(e.type==='POLYLINE'){pathPolyline(e)}else if(e.type==='ARC'){let p=screen({x:e.x,y:e.y});ctx.beginPath();ctx.arc(p.x,p.y,e.r*view.s,-e.a2*Math.PI/180,-e.a1*Math.PI/180,true);ctx.stroke()}});ctx.restore();$('count').textContent=ents.length+' nesne'}
function parseDXF(txt){let a=txt.replace(/\r/g,'').split('\n'),pairs=[];for(let i=0;i+1<a.length;i+=2)pairs.push([a[i].trim(),a[i+1].trim()]);let out=[],inEnt=false;for(let i=0;i<pairs.length;i++){let [c,v]=pairs[i];if(c==='2'&&v==='ENTITIES'){inEnt=true;continue}if(inEnt&&c==='0'&&v==='ENDSEC')break;if(!inEnt||c!=='0')continue;let type=v,vals={};i++;while(i<pairs.length&&pairs[i][0]!=='0'){let [gc,gv]=pairs[i];(vals[gc]??=[]).push(gv);i++}i--;const n=(k,d=0)=>+(vals[k]?.[0]??d);if(type==='LINE')out.push({type,a:{x:n('10'),y:n('20')},b:{x:n('11'),y:n('21')}});else if(type==='CIRCLE')out.push({type,x:n('10'),y:n('20'),r:n('40')});else if(type==='ARC')out.push({type,x:n('10'),y:n('20'),r:n('40'),a1:n('50'),a2:n('51')});else if(type==='LWPOLYLINE'){let xs=vals['10']||[],ys=vals['20']||[],bs=vals['42']||[],pts=xs.map((x,j)=>({x:+x,y:+(ys[j]||0)}));if(pts.length)out.push({type:'POLYLINE',pts,closed:(n('70')&1)!==0,bulges:bs.map(Number)})}}
return out}
function exportDXF(){let s=['0','SECTION','2','ENTITIES'];ents.forEach(e=>{if(e.type==='LINE')s.push('0','LINE','10',e.a.x,'20',e.a.y,'30','0','11',e.b.x,'21',e.b.y,'31','0');else if(e.type==='CIRCLE')s.push('0','CIRCLE','10',e.x,'20',e.y,'30','0','40',e.r);else if(e.type==='POLYLINE'){s.push('0','LWPOLYLINE','90',e.pts.length,'70',e.closed?'1':'0');e.pts.forEach((p,i)=>s.push('10',p.x,'20',p.y,...(e.bulges?.[i]?[['42',e.bulges[i]]].flat():[])))}else if(e.type==='ARC')s.push('0','ARC','10',e.x,'20',e.y,'30','0','40',e.r,'50',e.a1,'51',e.a2)});s.push('0','ENDSEC','0','EOF');let blob=new Blob([s.join('\r\n')],{type:'application/dxf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename.replace(/\.dxf$/i,'')+'_duzenlendi.dxf';a.click();URL.revokeObjectURL(url)}
$('file').onchange=async ev=>{let f=ev.target.files[0];if(!f)return;filename=f.name;try{let parsed=parseDXF(await f.text());ents=parsed;undo=[];redo=[];selected=-1;fit();say(parsed.length?f.name+' açıldı':'Dosyada desteklenen nesne bulunamadı.');$('status').textContent='Açıldı: '+f.name+' · Görüntülenen nesne: '+parsed.length}catch(e){say('DXF okunamadı: '+e.message)}};
$('save').onclick=exportDXF;$('fit').onclick=fit;$('zin').onclick=()=>zoom(1.25);$('zout').onclick=()=>zoom(.8);
function zoom(k,at={x:canvas.clientWidth/2,y:canvas.clientHeight/2}){let p=world(at);view.s*=k;view.x=at.x-p.x*view.s;view.y=at.y+p.y*view.s;draw()}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));say(tool==='pan'?'Pan modu: sürükleyerek kaydırın.':tool==='line'?'Çizgi modu: başlangıç ve bitiş noktasına dokunun.':'Seçim modu.')});
function distSeg(p,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function hit(p){let best=-1,bd=14;ents.forEach((e,i)=>{let d=1e9;if(e.type==='LINE')d=distSeg(p,e.a,e.b)*view.s;else if(e.type==='CIRCLE')d=Math.abs(Math.hypot(p.x-e.x,p.y-e.y)-e.r)*view.s;else if(e.type==='POLYLINE')for(let j=0;j<e.pts.length-(e.closed?0:1);j++)d=Math.min(d,distSeg(p,e.pts[j],e.pts[(j+1)%e.pts.length])*view.s);if(d<bd){bd=d;best=i}});return best}
function pos(ev){let r=canvas.getBoundingClientRect();return {x:ev.clientX-r.left,y:ev.clientY-r.top}}
canvas.addEventListener('pointerdown',ev=>{canvas.setPointerCapture(ev.pointerId);let p=pos(ev);pointers.set(ev.pointerId,p);if(pointers.size===2){let q=[...pointers.values()];lastPinch={d:Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y),mid:{x:(q[0].x+q[1].x)/2,y:(q[0].y+q[1].y)/2}};drag=null;return}if(tool==='pan'||ev.button===1||ev.pointerType==='touch'&&ev.isPrimary&&ev.buttons===4){drag={kind:'pan',p,last:{...p}};return}if(tool==='line'){let wp=world(p);if(!lineStart){lineStart=wp;say('Çizginin bitiş noktasını seçin.')}else{snapshot();ents.push({type:'LINE',a:lineStart,b:wp});lineStart=null;draw();say('Çizgi eklendi.')}return}let wp=world(p),idx=hit(wp);selected=idx;if(idx>=0&&tool==='select'){drag={kind:'move',p,last:wp,changed:false};}else drag={kind:'pan',p,last:{...p}};draw()});
canvas.addEventListener('pointermove',ev=>{if(!pointers.has(ev.pointerId))return;let p=pos(ev);pointers.set(ev.pointerId,p);if(pointers.size===2&&lastPinch){let q=[...pointers.values()],d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y),mid={x:(q[0].x+q[1].x)/2,y:(q[0].y+q[1].y)/2};zoom(d/lastPinch.d,lastPinch.mid);view.x+=mid.x-lastPinch.mid.x;view.y+=mid.y-lastPinch.mid.y;lastPinch={d,mid};draw();return}if(!drag)return;if(drag.kind==='pan'){view.x+=p.x-drag.last.x;view.y+=p.y-drag.last.y;drag.last=p;draw()}else if(drag.kind==='move'&&selected>=0){let wp=world(p),dx=wp.x-drag.last.x,dy=wp.y-drag.last.y;if(Math.abs(dx)+Math.abs(dy)>.001){if(!drag.changed){snapshot();drag.changed=true}let e=ents[selected];if(e.type==='LINE'){e.a.x+=dx;e.a.y+=dy;e.b.x+=dx;e.b.y+=dy}else if(e.type==='CIRCLE'||e.type==='ARC'){e.x+=dx;e.y+=dy}else e.pts.forEach(pt=>{pt.x+=dx;pt.y+=dy});drag.last=wp;draw()}}});
function end(ev){pointers.delete(ev.pointerId);if(pointers.size<2)lastPinch=null;drag=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
$('del').onclick=()=>{if(selected>=0){snapshot();ents.splice(selected,1);selected=-1;draw();say('Nesne silindi. Geri almak için ⌘Z.')}};
$('undo').onclick=()=>{if(!undo.length)return;redo.push(JSON.stringify(ents));restore(undo.pop());say('İşlem geri alındı.')};
$('redo').onclick=()=>{if(!redo.length)return;undo.push(JSON.stringify(ents));restore(redo.pop());say('İşlem yinelendi.')};
window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?$('redo').click():$('undo').click()}else if(e.key==='f'||e.key==='0')fit();else if(e.key==='+'||e.key==='=')zoom(1.2);else if(e.key==='-')zoom(.8);else if(e.key==='Delete'||e.key==='Backspace')$('del').click()});
new ResizeObserver(resize).observe(stage);resize();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body></html>
