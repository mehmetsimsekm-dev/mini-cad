.top{padding:3px 5px;gap:4px}.tools button{min-width:48px;min-height:44px;padding:3px 5px;gap:2px;font-size:10px;border-radius:5px}.tools svg{width:21px;height:21px;stroke:#63c7ff;stroke-width:1.8}.tools button.active svg{stroke:#fff}#tabs button{padding:6px 8px;font-size:12px}#docname{min-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}#nav{right:6px;top:8px;gap:2px}#nav button{width:36px;height:36px;padding:2px;font-size:20px;color:#7dd3fc}#nav #undo{color:#fbbf24}#nav #redo{color:#86efac}#nav button.active{background:#155ac4;color:white}#tree{width:155px;padding:8px;font-size:12px}#treeitems button{font-size:11px;padding:5px}#status{padding:3px 8px}.bottom{padding:5px 8px;font-size:11px}#del svg,#trim svg,#clear svg{stroke:#fb7185}#move svg,#pointmove svg,#copy svg,#rotate svg,#align svg,#extend svg,#short svg{stroke:#fbbf24}#dim svg,#angle svg,#diam svg,#rad svg{stroke:#86efac}#circle svg,#arc svg,#rect svg,#poly svg,#free svg{stroke:#67e8f9}#snap svg,#ortho svg,#grid svg{stroke:#c4b5fd}#save svg,#saveas svg,#new svg,#open svg{stroke:#a3e635}@media(max-width:700px){#tree{width:115px}#tabs button{padding:5px;font-size:11px}}
canvas,#stage{touch-action:none;filter:none;backdrop-filter:none}#drawoptions{display:contents!important}#tangent{color:#f472b6} </style>

<body><div id="app">
<div class="top" id="tabs"><button id="treeToggle" title="Çizim ağacı">☰</button><button data-tab="0">Dosya</button><button data-tab="1">Çizim</button><button data-tab="2">Düzenleme</button><button data-tab="3">Ölçülendirme</button><button data-tab="4">Görünüm</button><span id="docname"></span><button id="quickSave" title="Kaydet">▣</button></div><div class="top tools" data-panel="0" style="display:flex"><button id="new">Yeni DXF</button><button id="open">DXF Aç</button><button id="save">Kaydet</button><button id="saveas">Farklı kaydet</button><button id="clear">Temizle</button></div><div class="top tools" data-panel="1" style="display:none"><button id="drawmenu">Çizgi ▾</button><span id="drawoptions" style="display:none;gap:6px"><button id="line">Düz çizgi</button><button id="free">Serbest stil</button><button id="rect">Dikdörtgen</button><button id="circle">Daire</button><button id="arc">Yay</button><button id="poly">Polyline</button><button id="finish">Bitir</button></span><button id="exact">Koordinat</button><button id="length" hidden></button></div><div class="top tools" data-panel="2" style="display:none"><button id="select">Seç</button><button id="multi">Çoklu seç</button><button id="del">Sil</button><button id="trim">Kırp</button><button id="extend">Uzat</button><button id="stretch">Stretch</button><button id="short">Uzunluk değiştir</button><button id="move">Serbest taşı</button><button id="pointmove">Noktadan noktaya</button><button id="align">Yatay / Dikey</button><button id="rotate">Döndür</button><button id="copy">Kopyala</button></div><div class="top tools" data-panel="3" style="display:none"><button id="measure" hidden></button><button id="dim">Otomatik ölçü</button><button id="dimx" hidden></button><button id="dimy" hidden></button><button id="angle">Açı</button><button id="diam">Çap</button><button id="rad">Yarıçap</button></div><div class="top tools" data-panel="4" style="display:none"><button id="fit">Sığdır</button><button id="zoomout">−</button><button id="zoomin">+</button><button id="pan">Pan</button><button id="grid">Izgara</button><button id="snap">Snap</button><button id="ortho">Ortho</button></div><input id="file" type="file" accept=".dxf"><div id="status">DXF dosyası açın. İki parmakla yakınlaştırıp kaydırabilirsiniz.</div>
<div id="workspace"><aside id="tree"><b>Çizim Ağacı</b><div id="treeitems"></div></aside><div id="stage"><canvas id="c"></canvas><div id="nav"><button data-go="zoomin">＋</button><button data-go="zoomout">−</button><button data-go="fit">⛶</button><button data-go="pan" title="Ekranı sürükle">✋</button><button id="undo" title="Geri al" aria-label="Geri al">↶</button><button id="redo" title="İleri al" aria-label="İleri al">↷</button></div></div></div>

</div>
<div id="entry" hidden><div id="entryhead">↕ Sürükleyin</div><div id="entrylabel"></div><input id="entryvalue" inputmode="decimal"><button id="entryok">Onayla</button> <button id="entrycancel">İptal</button></div><script>
(()=> {
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
const $=id=>document.getElementById(id); let W=1,H=1,scale=1,ox=0,oy=0;
let entities=[],original=[],rawLines=[],fileName='drawing.dxf',mode='select',selected=-1,drag=null,lineStart=null;
let multi=new Set(), gridOn=true,snapOn=true,orthoOn=false, pending=[]; let boundary=-1, targetPoint=null, gesture=false; let history=[],future=[],pinch=null,dirty=false;
const status=t=>$('status').textContent=t;
function clone(x){return JSON.parse(JSON.stringify(x))}
function pairsFrom(text){let a=text.replace(/\r/g,'').split('\n');if(a[a.length-1]==='')a.pop();let p=[];for(let i=0;i+1<a.length;i+=2){let code=Number(a[i].trim());if(Number.isFinite(code))p.push({c:code,v:a[i+1]});}return p}
function parse(text){
 const p=pairsFrom(text); rawLines=p; entities=[]; let inEnt=false,rec=[];
 const flush=()=>{if(!rec.length)return;let type=String(rec[0].v).trim().toUpperCase();let e={type,groups:clone(rec),layer:(rec.find(x=>x.c===8)||{v:'0'}).v,deleted:false};
 const vals=c=>rec.filter(x=>x.c===c).map(x=>Number(x.v));
 if(type==='LINE'){e.pts=[{x:vals(10)[0],y:vals(20)[0]},{x:vals(11)[0],y:vals(21)[0]}];}
 else if(type==='CIRCLE'||type==='ARC'){e.center={x:vals(10)[0],y:vals(20)[0]};e.r=vals(40)[0];if(type==='ARC'){e.start=vals(50)[0];e.end=vals(51)[0];}}
 else if(type==='LWPOLYLINE'){e.vertices=[];for(let i=0;i<rec.length;i++){if(rec[i].c===10){let end=rec.findIndex((x,j)=>j>i&&x.c===10);let chunk=rec.slice(i+1,end<0?rec.length:end);let y=chunk.find(x=>x.c===20);let b=chunk.find(x=>x.c===42);e.vertices.push({x:Number(rec[i].v),y:y?Number(y.v):0,bulge:b?Number(b.v):0});}}e.closed=(Number((rec.find(x=>x.c===70)||{v:0}).v)&1)!==0;}
 else if(type==='TEXT'){e.center={x:vals(10)[0],y:vals(20)[0]};e.height=vals(40)[0]||2.5;e.text=(rec.find(x=>x.c===1)||{v:''}).v;}else if(type==='POINT'){e.center={x:vals(10)[0],y:vals(20)[0]};}
 else e.unsupported=true;
 if(['LINE','CIRCLE','ARC','LWPOLYLINE','POINT'].includes(type))e.valid=true;
 entities.push(e);rec=[];
 };
 for(const q of p){
 if(q.c===0 && String(q.v).trim().toUpperCase()==='ENDSEC'){
   if(inEnt){flush();inEnt=false;}
   continue;
 }
 if(q.c===0){
   if(inEnt)flush();
   if(inEnt)rec=[q]; else rec=[];
   continue;
 }
 if(q.c===2&&String(q.v).trim().toUpperCase()==='ENTITIES')inEnt=true;
 if(inEnt&&rec.length)rec.push(q);
 }
 flush(); original=clone(entities); selected=-1;multi.clear();history=[];future=[];dirty=false;fit();
 status(`${fileName} • ${entities.length} öğe • Desteklenen: LINE, CIRCLE, ARC, LWPOLYLINE, POINT. Diğer öğeler korunur.`);
}
function resize(){let r=stage.getBoundingClientRect(),dpr=(devicePixelRatio||1);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);draw()}
new ResizeObserver(resize).observe(stage);
function world(x,y){return {x:(x-ox)/scale,y:(oy-y)/scale}}
function screen(p){return {x:ox+p.x*scale,y:oy-p.y*scale}}
function fit(){refreshDimensions();let pts=[];for(let e of entities){if(e.deleted||e.sourceMissing)continue;if(e.pts)pts.push(...e.pts);if(e.center){let r=e.r||0;pts.push({x:e.center.x-r,y:e.center.y-r},{x:e.center.x+r,y:e.center.y+r})}if(e.vertices)pts.push(...e.vertices)}
if(!pts.length){scale=1;ox=W/2;oy=H/2;draw();return}
let minx=Math.min(...pts.map(p=>p.x)),maxx=Math.max(...pts.map(p=>p.x)),miny=Math.min(...pts.map(p=>p.y)),maxy=Math.max(...pts.map(p=>p.y));let dx=maxx-minx||1,dy=maxy-miny||1;scale=Math.min((W-60)/dx,(H-60)/dy);scale=Math.max(.00001,Math.min(scale,10000));ox=W/2-(minx+maxx)/2*scale;oy=H/2+(miny+maxy)/2*scale;draw()}
function bulgePoints(a,b,bulge){if(!bulge)return [a,b];let theta=4*Math.atan(bulge),dx=b.x-a.x,dy=b.y-a.y,ch=Math.hypot(dx,dy),r=ch/(2*Math.sin(Math.abs(theta)/2));let mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2},h=ch/(2*Math.tan(theta/2));let nx=-dy/ch,ny=dx/ch,c={x:mid.x+nx*h,y:mid.y+ny*h};let start=Math.atan2(a.y-c.y,a.x-c.x),n=Math.min(2048,Math.max(8,Math.ceil(Math.abs(theta)*Math.max(r*scale,1)/7))),out=[];for(let i=0;i<=n;i++){let t=start+theta*i/n;out.push({x:c.x+r*Math.cos(t),y:c.y+r*Math.sin(t)})}return out}
function arcPts(e){let a=e.start*Math.PI/180,b=e.end*Math.PI/180;while(b<a)b+=Math.PI*2;let n=Math.min(2048,Math.max(12,Math.ceil((b-a)*Math.max(e.r*scale,1)/6)));let p=[];for(let i=0;i<=n;i++){let t=a+(b-a)*i/n;p.push({x:e.center.x+e.r*Math.cos(t),y:e.center.y+e.r*Math.sin(t)})}return p}
function path(points,close=false){if(!points.length)return;let s=screen(points[0]);ctx.beginPath();ctx.moveTo(s.x,s.y);for(let i=1;i<points.length;i++){s=screen(points[i]);ctx.lineTo(s.x,s.y)}if(close)ctx.closePath();ctx.stroke()}
function draw(){if(!ctx)return;refreshDimensions();ctx.clearRect(0,0,W,H);ctx.fillStyle='#0b1220';ctx.fillRect(0,0,W,H);
 // grid
 let step=gridStep();let left=world(0,H).x,right=world(W,0).x,bottom=world(0,H).y,top=world(0,0).y;
 ctx.lineWidth=1;ctx.strokeStyle='#172338';ctx.beginPath();for(let x=Math.ceil(left/step)*step;x<right;x+=step){let s=screen({x,y:0});ctx.moveTo(s.x,0);ctx.lineTo(s.x,H)}for(let y=Math.ceil(bottom/step)*step;y<top;y+=step){let s=screen({x:0,y});ctx.moveTo(0,s.y);ctx.lineTo(W,s.y)}if(gridOn)ctx.stroke();
 entities.forEach((e,i)=>{if(e.deleted||e.sourceMissing||hiddenTypes.has(treeType(e)))return;ctx.strokeStyle=(i===selected||multi.has(i))?'#f59e0b':e.layer==='DIM'?'#65ef75':'#d1d5db';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=(i===selected||multi.has(i))?2.8:1.5;
 if(e.type==='LINE')path(e.pts);else if(e.type==='CIRCLE'){let s=screen(e.center);ctx.beginPath();ctx.arc(s.x,s.y,e.r*scale,0,Math.PI*2);ctx.stroke()}else if(e.type==='ARC')path(arcPts(e));else if(e.type==='LWPOLYLINE'){let pts=[];for(let j=0;j<e.vertices.length-(e.closed?0:1);j++){let a=e.vertices[j],b=e.vertices[(j+1)%e.vertices.length];let seg=bulgePoints(a,b,a.bulge);pts.push(...(j?seg.slice(1):seg))}path(pts,e.closed)}else if(e.type==='TEXT'){let s=screen(e.center);ctx.font=`${Math.max(8,e.height*scale)}px sans-serif`;ctx.fillText(e.text,s.x,s.y)}else if(e.type==='POINT'){let s=screen(e.center);ctx.beginPath();ctx.arc(s.x,s.y,3,0,Math.PI*2);ctx.fill()}
 });
 if(drag?.free){ctx.strokeStyle='#22c55e';path(drag.pts)} if(pending.length>1&&mode==='poly'){ctx.strokeStyle='#22c55e';path(pending)}
 $('undo').disabled=!history.length;$('redo').disabled=!future.length;document.querySelector('[data-go=pan]').classList.toggle('active',mode==='pan');updateTree();ctx.strokeStyle='#ef4444';ctx.beginPath();ctx.moveTo(22,H-22);ctx.lineTo(54,H-22);ctx.stroke();ctx.strokeStyle='#22c55e';ctx.beginPath();ctx.moveTo(22,H-22);ctx.lineTo(22,H-54);ctx.stroke();ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.fillText('X',57,H-18);ctx.fillText('Y',18,H-58);if(lineStart){let s=screen(lineStart);ctx.fillStyle='#22c55e';ctx.beginPath();ctx.arc(s.x,s.y,5,0,Math.PI*2);ctx.fill()}
}
function gridStep(){let raw=80/scale,p=Math.pow(10,Math.floor(Math.log10(raw)));for(let m of [1,2,5,10])if(m*p>=raw)return m*p;return 10*p}
function saveHist(){history.push(clone(entities));if(history.length>60)history.shift();future=[];dirty=true}
function segments(e){if(e.pts)return [e.pts];if(e.type==='ARC')return [arcPts(e)];if(e.vertices)return e.vertices.slice(0,e.closed?e.vertices.length:-1).map((v,i)=>bulgePoints(v,e.vertices[(i+1)%e.vertices.length],v.bulge));return []}
function distSeg(p,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function nearest(p){let best=-1,bd=16;entities.forEach((e,i)=>{if(e.deleted||e.sourceMissing||e.layer==='DIM'||e.linkDim||hiddenTypes.has(treeType(e)))return;let d=Infinity;for(let seg of segments(e))for(let j=1;j<seg.length;j++)d=Math.min(d,distSeg(p,screen(seg[j-1]),screen(seg[j])));if(e.type==='CIRCLE'){let c=screen(e.center);d=Math.abs(Math.hypot(p.x-c.x,p.y-c.y)-e.r*scale)}if(e.type==='POINT'||e.type==='TEXT'){let c=screen(e.center);d=Math.hypot(p.x-c.x,p.y-c.y)}if(d<bd){bd=d;best=i}});return best}
function snap(p){let q=world(p.x,p.y),best=12;if(!snapOn)return q;for(let e of entities){if(e.deleted||e.sourceMissing||hiddenTypes.has(treeType(e)))continue;for(let v of [...(e.pts||e.vertices||[]),...(e.center?[e.center]:[]),...(e.type==='LINE'?[{x:(e.pts[0].x+e.pts[1].x)/2,y:(e.pts[0].y+e.pts[1].y)/2}]:[]),...(e.r?[0,90,180,270].filter(a=>e.type==='CIRCLE'||((a-e.start+360)%360)<=((e.end-e.start+360)%360)).map(a=>({x:e.center.x+e.r*Math.cos(a*Math.PI/180),y:e.center.y+e.r*Math.sin(a*Math.PI/180)})):[])]){let c=screen(v),d=Math.hypot(c.x-p.x,c.y-p.y);if(d<best){best=d;q={x:v.x,y:v.y}}}}return q}
function addLine(a,b,layer='0'){entities.push({type:'LINE',pts:[a,b],layer,added:true,groups:[]})}
function intersect(a,b,c,d){let x=b.x-a.x,y=b.y-a.y,u=d.x-c.x,v=d.y-c.y,den=x*v-y*u;if(Math.abs(den)<1e-12)return null;let t=((c.x-a.x)*v-(c.y-a.y)*u)/den,k=((c.x-a.x)*y-(c.y-a.y)*x)/den;return {t,k,p:{x:a.x+t*x,y:a.y+t*y}}}
function tap(p){let q=snap(p),i=nearest(p);if(extraTap(q,i))return;if(orthoOn&&lineStart&&mode==='line')q=orth(lineStart,q);if(['trim','extend'].includes(mode))return editTap(p,i);
if(mode==='dim'&&!lineStart&&i>=0&&entities[i].type==='LINE'){let [a,b]=entities[i].pts;return alignedDim(a,b,i)}

if(!lineStart){lineStart=q;status('İkinci noktaya dokunun.');return draw()}let a=lineStart,b=q;lineStart=null;let d=Math.hypot(b.x-a.x,b.y-a.y);if(d<1e-9)return draw();if(mode==='measure'){status(`Mesafe: ${d.toFixed(3)} mm | X: ${Math.abs(b.x-a.x).toFixed(3)} | Y: ${Math.abs(b.y-a.y).toFixed(3)}`);return draw()}saveHist();if(mode==='line')addLine(a,b);if(mode==='rect'){let c={x:b.x,y:a.y},f={x:a.x,y:b.y};addLine(a,c);addLine(c,b);addLine(b,f);addLine(f,a)}if(mode==='circle')entities.push({type:'CIRCLE',center:a,r:d,layer:'0',added:true});if(mode==='dim'){history.pop();return alignedDim(a,b)}status('İşlem tamamlandı.');draw()}
function pointerPos(ev){let r=canvas.getBoundingClientRect();return {x:ev.clientX-r.left,y:ev.clientY-r.top}}
let pointers=new Map();
canvas.addEventListener('pointerdown',ev=>{canvas.setPointerCapture(ev.pointerId);let p=pointerPos(ev);pointers.set(ev.pointerId,p);
 if(pointers.size===2){gesture=true;let a=[...pointers.values()];pinch={dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),scale,mid:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},world:world((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2)};drag=null;return}
 if(['line','rect','circle','measure','dim','trim','extend','multi','arc','poly','short','copy','dimx','dimy','angle','diam','rad','pointmove','align','rotate','tangent'].includes(mode)){drag={tap:true,p0:p};return}
 if(mode==='free'){drag={free:true,pts:[world(p.x,p.y)]};return} if(mode==='select'||mode==='move'){let idx=nearest(p);if(mode==='select'){multi.clear();selected=idx;} if(idx>=0){let ids=mode==='move'&&multi.has(idx)?[...multi]:[idx];if(mode==='move'&&!multi.has(idx))multi.clear();selected=idx;drag={p0:p,ids,before:ids.map(j=>clone(entities[j])),idx,moved:false}}draw();return}
 if(mode==='pan')drag={p0:p,ox,oy,pan:true};
});
canvas.addEventListener('pointermove',ev=>{let p=pointerPos(ev);if(pointers.has(ev.pointerId))pointers.set(ev.pointerId,p);$('coords').textContent=`X: ${world(p.x,p.y).x.toFixed(2)}  Y: ${world(p.x,p.y).y.toFixed(2)}`;
